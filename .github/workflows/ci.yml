name: CI

# Cost control (the repo may be private on a free plan; Actions minutes are billed per job):
# this file holds only the four cheap required checks. Pushes to main are audited by main-guard.yml,
# tests live in tests.yml and web.yml (skipped for docs-only changes), and audit.yml runs weekly.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs checks
        run: python3 scripts/check_docs.py
      - name: Show the current status in the run summary
        run: python3 scripts/build_status.py >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/scan_secrets.py

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check_repo_hygiene.py
      - name: Component reviewer check (ADR-0034, owner is not a reviewer)
        run: python3 scripts/check_component_reviewers.py

  pr-log-gate:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require a new session log when files outside docs/ and .github/ change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")  # diff against the branch point, not the moved main
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          outside=$(echo "$changed" | grep -v -E '^(docs/|\.github/)' || true)
          if [ -z "$outside" ]; then
            echo "Only docs/ and .github/ changed; log not required."
            exit 0
          fi
          new_logs=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" | grep -E '^docs/log/' | grep -v -E '/(README|TEMPLATE)\.md$' || true)
          if [ -z "$new_logs" ]; then
            echo "Files outside docs/ and .github/ changed but no new file under docs/log/ was added:"
            echo "$outside"
            echo "Run: python3 scripts/new_log.py --author <you> --tool <tool> --slug <topic> --ids <ids>"
            exit 1
          fi
          echo "New log(s): $new_logs"
      - name: Lane guard (each founder edits only their own lane unless a waiver is logged)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")  # diff against the branch point, not the moved main
          python3 scripts/check_lanes.py --base "$BASE_SHA" --head "$HEAD_SHA" --actor "$ACTOR"
      - name: Trail check (log has valid plan IDs and the rows are not still todo)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")  # diff against the branch point, not the moved main
          python3 scripts/check_pr_trail.py --base "$BASE_SHA" --head "$HEAD_SHA"
