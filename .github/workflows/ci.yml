name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs checks
        run: python3 scripts/check_docs.py
      - name: Show the current status in the run summary
        run: python3 scripts/build_status.py >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/scan_secrets.py

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check_repo_hygiene.py

  pr-log-gate:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require a new session log when files outside docs/ and .github/ change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          outside=$(echo "$changed" | grep -v -E '^(docs/|\.github/)' || true)
          if [ -z "$outside" ]; then
            echo "Only docs/ and .github/ changed; log not required."
            exit 0
          fi
          new_logs=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" | grep -E '^docs/log/' | grep -v -E '/(README|TEMPLATE)\.md$' || true)
          if [ -z "$new_logs" ]; then
            echo "Files outside docs/ and .github/ changed but no new file under docs/log/ was added:"
            echo "$outside"
            echo "Run: python3 scripts/new_log.py --author <you> --tool <tool> --slug <topic> --ids <ids>"
            exit 1
          fi
          echo "New log(s): $new_logs"
      - name: Lane guard (each founder edits only their own lane unless a waiver is logged)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_lanes.py --base "$BASE_SHA" --head "$HEAD_SHA" --actor "$ACTOR"
      - name: Trail check (log has valid plan IDs and the rows are not still todo)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_trail.py --base "$BASE_SHA" --head "$HEAD_SHA"

  blueprint-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt
      - name: Validator tests
        run: python3 -m pytest services/blueprint/tests -q
      - name: Contract example validates
        run: PYTHONPATH=services/blueprint python3 -m validator contracts/examples/blueprint-trading-minimal.json

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r evals/requirements.txt
      - name: Eval harness tests
        run: python3 -m pytest evals/tests -q
      - name: Eval sets are valid
        run: python3 -m evals.harness check

  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt
      - name: Template tests
        run: python3 -m pytest services/discovery/tests -q

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Script tests (phase exit check)
        run: python3 -m pytest scripts/tests -q
      - name: Tenant provisioning script tests (ERP-003)
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_003_tenant_provisioning.py -v

  dev-bench-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dev bench contract, pin and entrypoint tests (live and networked build tests skip without a bench)
        working-directory: infra/dev/docker
        run: python3 -m unittest discover -s tests -v

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt
      - name: Contract schemas and examples
        run: python3 scripts/check_contracts.py

  trading-ar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt
      - name: Trading Arabic pack and engine audit tests
        run: |
          python3 -m unittest discover -s components/core/trading_ar/tests -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_006_arabic_translations.py -v

  zatca-phase1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ZATCA Phase 1 component and engine wrapper tests (CMP-003)
        run: |
          python3 -m unittest discover -s components/compliance/zatca_sa/tests -t . -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_zatca_phase1_engine.py -v

  engine-adapter-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt "pydantic>=2"
      - name: Apply with preview & DDL plan gate tests (BPL-007)
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_007_apply_preview_gate.py -q
      - name: Engine adapter unit tests (BPL-012, ERP-012)
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_012_engine_adapter.py apps/engine/change_engine/change_engine/tests/test_erp_012_frappe_adapter.py -q
      - name: Phase 0 engine proof unit and contract tests (ERP-021)
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_021_phase0_proofs.py -v
      - name: Engine adapter conformance suite (BPL-025 via change_engine.adapter)
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_harness
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q
      - name: Frappe runtime engine adapter conformance suite (ERP-012 via make_frappe_harness)
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_frappe_harness
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q

  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt
      - name: Gateway token & cost metering unit and evstream conformance tests (PLT-025)
        env:
          REQUIRE_EVSTREAM_TESTS: "1"
          PYTHONPATH: services:services/blueprint/events
        run: python3 -m unittest discover -s services/gateway/tests -v

  theme-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Theme engine tests (BRD-005)
        run: node --test web/app/theme/

  operate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/blueprint/requirements.txt pytest
      - name: Tool API generator tests (OPR-003)
        run: python3 -m pytest services/operate/tests -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the audit tool
        run: pip install pip-audit==2.9.0
      - name: Audit Python requirements for known vulnerabilities
        run: |
          pip-audit -r services/blueprint/requirements.txt
          pip-audit -r evals/requirements.txt
      - name: Software bill of materials (CycloneDX) for the Python requirements
        run: pip-audit -r services/blueprint/requirements.txt -f cyclonedx-json -o sbom-python.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: sbom-python.cdx.json
