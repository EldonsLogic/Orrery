name: Main guard

# Audits every push to main. Branch protection blocks direct pushes (ADR-0021); this re-runs the checks and opens an issue for both founders if main was pushed to directly or a check fails.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-run repo checks on main
        id: checks
        continue-on-error: true
        run: |
          python3 scripts/build_status.py
          git diff --exit-code docs/STATUS.md
          python3 scripts/check_docs.py
          python3 scripts/check_repo_hygiene.py
          python3 scripts/scan_secrets.py
      - name: Was this push made through a pull request?
        id: viapr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
          echo "prs=$n" >> "$GITHUB_OUTPUT"
      - name: Open an issue if main was pushed directly or checks failed
        if: steps.viapr.outputs.prs == '0' || steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Main guard: ${{ github.sha }} needs attention" \
            --body "Commit ${{ github.sha }} on main by ${{ github.actor }}. Pull requests found: ${{ steps.viapr.outputs.prs }}. Checks outcome: ${{ steps.checks.outcome }}. Direct pushes to main break the rules (docs/RULES.md rule 10). Fix forward through a PR or revert, and log it. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee EldonsLogic,sayegh9
