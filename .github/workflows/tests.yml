name: Tests

# Cost control & service CI/CD (INF-003, GOV-049):
# Runs tests and lint for services/* and apps/engine on pull requests with path filters,
# installs dependencies per changed service, and pins actions by commit SHA.
# Disabled deploy-to-staging job skeleton included (see infra/staging.md).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test framework
        run: pip install "pytest==9.2.0"

      - name: Detect changed service and test paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA" || true)
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            CHANGED="ALL"
          fi

          # If the workflow itself changed or this is a manual dispatch, run everything
          if echo "$CHANGED" | grep -E '^(\.github/workflows/tests\.yml|ALL$)' > /dev/null; then
            ALL=1
          else
            ALL=0
          fi

          check_path() {
            local pattern="$1"
            if [ "$ALL" = "1" ] || echo "$CHANGED" | grep -E "$pattern" > /dev/null; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "blueprint=$(check_path '^services/blueprint/|^contracts/')" >> "$GITHUB_OUTPUT"
          echo "control_plane=$(check_path '^services/control-plane/')" >> "$GITHUB_OUTPUT"
          echo "datasets=$(check_path '^services/datasets/')" >> "$GITHUB_OUTPUT"
          echo "discovery=$(check_path '^services/discovery/')" >> "$GITHUB_OUTPUT"
          echo "gateway=$(check_path '^services/gateway/')" >> "$GITHUB_OUTPUT"
          echo "operate=$(check_path '^services/operate/')" >> "$GITHUB_OUTPUT"
          echo "studio=$(check_path '^services/studio/')" >> "$GITHUB_OUTPUT"
          echo "engine=$(check_path '^apps/engine/')" >> "$GITHUB_OUTPUT"
          echo "evals=$(check_path '^evals/')" >> "$GITHUB_OUTPUT"
          echo "scripts=$(check_path '^scripts/')" >> "$GITHUB_OUTPUT"
          echo "infra=$(check_path '^infra/')" >> "$GITHUB_OUTPUT"
          echo "components=$(check_path '^components/')" >> "$GITHUB_OUTPUT"

      # --- services/blueprint ---
      - name: Install dependencies (services/blueprint)
        if: steps.filter.outputs.blueprint == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/blueprint)
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 -m compileall services/blueprint

      - name: Blueprint validator, compiler and adapter tests
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 -m pytest services/blueprint/tests -q

      - name: Contract example validates
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: PYTHONPATH=services/blueprint python3 -m validator contracts/examples/blueprint-trading-minimal.json

      - name: Contract schemas and examples
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 scripts/check_contracts.py

      # --- services/control-plane ---
      - name: Lint (services/control-plane)
        if: steps.filter.outputs.control_plane == 'true' && !cancelled()
        run: python3 -m compileall services/control-plane

      # --- services/datasets ---
      - name: Lint (services/datasets)
        if: steps.filter.outputs.datasets == 'true' && !cancelled()
        run: python3 -m compileall services/datasets

      - name: Datasets generator and loader tests (DAT-002)
        if: steps.filter.outputs.datasets == 'true' && !cancelled()
        run: python3 -m pytest services/datasets/tests -q

      # --- services/discovery ---
      - name: Install dependencies (services/discovery)
        if: steps.filter.outputs.discovery == 'true'
        run: pip install -r services/discovery/requirements.txt

      - name: Lint (services/discovery)
        if: steps.filter.outputs.discovery == 'true' && !cancelled()
        run: python3 -m compileall services/discovery

      - name: Discovery and connector tests
        if: steps.filter.outputs.discovery == 'true' && !cancelled()
        run: python3 -m pytest services/discovery/tests -q

      # --- services/gateway ---
      - name: Install dependencies (services/gateway)
        if: steps.filter.outputs.gateway == 'true'
        run: pip install "pydantic>=2"

      - name: Lint (services/gateway)
        if: steps.filter.outputs.gateway == 'true' && !cancelled()
        run: python3 -m compileall services/gateway

      - name: Gateway token and cost metering tests (PLT-025)
        if: steps.filter.outputs.gateway == 'true' && !cancelled()
        env:
          REQUIRE_EVSTREAM_TESTS: "1"
          PYTHONPATH: services:services/blueprint/events
        run: python3 -m unittest discover -s services/gateway/tests -v

      # --- services/operate ---
      - name: Install dependencies (services/operate)
        if: steps.filter.outputs.operate == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/operate)
        if: steps.filter.outputs.operate == 'true' && !cancelled()
        run: python3 -m compileall services/operate

      - name: Tool API generator tests (OPR-003)
        if: steps.filter.outputs.operate == 'true' && !cancelled()
        run: python3 -m pytest services/operate/tests -q

      # --- services/studio ---
      - name: Lint (services/studio)
        if: steps.filter.outputs.studio == 'true' && !cancelled()
        run: python3 -m compileall services/studio

      - name: Studio API and static tests
        if: steps.filter.outputs.studio == 'true' && !cancelled()
        run: python3 -m pytest services/studio/tests -q

      # --- apps/engine ---
      - name: Install dependencies (apps/engine)
        if: steps.filter.outputs.engine == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (apps/engine)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        run: python3 -m compileall apps/engine

      - name: Tenant provisioning script tests (ERP-003)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_003_tenant_provisioning.py -v

      - name: Bilingual tax invoice print format tests (ERP-007)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine:.
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_007_bilingual_tax_invoice.py -v

      - name: Apply with preview and DDL plan gate tests (BPL-007)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_007_apply_preview_gate.py -q

      - name: Blueprint rollback tests (BPL-008)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_008_blueprint_rollback.py -q

      - name: Engine adapter unit tests (BPL-012, ERP-012)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_012_engine_adapter.py apps/engine/change_engine/change_engine/tests/test_erp_012_frappe_adapter.py -q

      - name: Phase 0 engine proof unit and contract tests (ERP-021)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_021_phase0_proofs.py -v

      - name: Engine adapter conformance suite (BPL-025 via change_engine.adapter)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_harness
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q

      - name: Frappe runtime engine adapter conformance suite (ERP-012 via make_frappe_harness)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_frappe_harness
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q

      # --- evals ---
      - name: Install dependencies (evals)
        if: steps.filter.outputs.evals == 'true'
        run: pip install -r evals/requirements.txt

      - name: Eval harness tests and sets
        if: steps.filter.outputs.evals == 'true' && !cancelled()
        run: |
          python3 -m pytest evals/tests -q
          python3 -m evals.harness check

      # --- scripts ---
      - name: Script tests (phase exit check)
        if: steps.filter.outputs.scripts == 'true' && !cancelled()
        run: python3 -m pytest scripts/tests -q

      # --- infra ---
      - name: Dev bench contract, pin and entrypoint tests (live tests skip without a bench)
        if: steps.filter.outputs.infra == 'true' && !cancelled()
        working-directory: infra/dev/docker
        run: python3 -m unittest discover -s tests -v

      # --- components ---
      - name: Trading Arabic pack and engine audit tests
        if: steps.filter.outputs.components == 'true' && !cancelled()
        run: |
          python3 -m unittest discover -s components/core/trading_ar/tests -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_006_arabic_translations.py -v

      - name: ZATCA Phase 1 component and engine wrapper tests (CMP-003)
        if: steps.filter.outputs.components == 'true' && !cancelled()
        run: |
          python3 -m unittest discover -s components/compliance/zatca_sa/tests -t . -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_zatca_phase1_engine.py -v

  deploy-staging:
    name: Deploy to staging (disabled)
    needs: [python-tests]
    runs-on: ubuntu-latest
    if: false  # DISABLED: No staging environment exists yet (ADR-0018). See infra/staging.md.
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Deploy placeholder
        run: |
          echo "Staging deployment is disabled: staging environment and hosting provider not yet provisioned."
          echo "See infra/staging.md for founder setup requirements."
