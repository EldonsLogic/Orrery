name: Tests

# Cost control & service CI/CD (INF-003, GOV-049):
# Runs tests and lint for services/*, apps/engine, components, evals, scripts, and infra.
# Pull requests use fail-closed path filters with cross-service dependency triggers;
# pushes to main and workflow_dispatch run the full suite.
# Actions are pinned by commit SHA; deploy-staging skeleton remains disabled (infra/staging.md).
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      # Executable brand tools and token inputs are tested by QA-007.
      - "docs/brand/tools/**"
      - "docs/brand/tokens/**"
      - "!**.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!web/**"
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      # Executable brand tools and token inputs are tested by QA-007.
      - "docs/brand/tools/**"
      - "docs/brand/tokens/**"
      - "!**.md"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test framework
        run: pip install "pytest==9.2.0"

      - name: Detect changed service and test paths (fail-closed)
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ALL=0
          CHANGED=""

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
              echo "::warning::git merge-base failed; failing closed by running all suites"
              ALL=1
            elif ! CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA"); then
              echo "::warning::git diff failed; failing closed by running all suites"
              ALL=1
            elif [ -z "$CHANGED" ]; then
              echo "::warning::Empty diff on PR; failing closed by running all suites"
              ALL=1
            fi
          else
            # push to main, workflow_dispatch, or missing PR SHAs -> run full suite
            ALL=1
          fi

          # Refuse changed Python tests outside the suites wired below. Selecting
          # ALL alone cannot run a new suite that has no test command yet.
          while IFS= read -r path; do
            case "$path" in
              */test_*.py|*/tests.py|*/tests/*_test.py)
                case "$path" in
                  docs/brand/tools/*|services/blueprint/tests/*|services/control-plane/tests/*|services/datasets/tests/*|services/discovery/tests/*|services/gateway/tests/*|services/operate/tests/*|services/studio/tests/*|evals/tests/*|scripts/tests/*|infra/dev/docker/tests/*|infra/invisibility/tests/*|components/core/trading_ar/tests/*|components/compliance/zatca_sa/tests/*|components/compliance/country_pack/tests/*) continue ;;
                  services/discovery/accountant_view/tests/*|services/discovery/gap_analysis/tests/*|services/discovery/quote/tests/*|services/discovery/template_flow/tests/*|services/operate/memory/tests/*) continue ;;
                esac
                if ! grep -Fq -- "$path" .github/workflows/tests.yml; then
                  echo "::error::Unmapped test: $path; wire its suite into this workflow"
                  exit 1
                fi
                ;;
            esac
          done <<< "$CHANGED"

          # Trigger full suite on shared contracts, workflows, scripts, or any unmapped non-doc file
          if [ "$ALL" = "0" ]; then
            if grep -qE '^(contracts/|\.github/|scripts/)' <<< "$CHANGED"; then
              ALL=1
            elif grep -qvE '^(services/(blueprint|control-plane|datasets|discovery|gateway|operate|studio)/|apps/engine/|evals/|scripts/|infra/|components/|docs/|web/|\.github/)|\.md$' <<< "$CHANGED"; then
              echo "::warning::Unmapped path changed; failing closed by running all suites"
              ALL=1
            fi
          fi

          # Here-strings have no upstream producer that grep -q can SIGPIPE;
          # echo | grep -q under pipefail can turn a real match into false.
          check_path() {
            local pattern="$1"
            if [ "$ALL" = "1" ] || grep -qE "$pattern" <<< "$CHANGED"; then
              echo "true"
            else
              echo "false"
            fi
          }

          # Cross-service dependency graph:
          # - services/blueprint provides evstream/validator/compiler/adapter/tokens/registry
          #   used by discovery, gateway, operate, studio, engine, and evals.
          # - services/datasets is used by studio.
          # - Operate integrates gateway metering and control-plane identity.
          # - Evals exercise the discovery connectors and the operate runtime.
          # - Blueprint tests use discovery templates, component manifests and brand tokens.
          # - ERP-003 and ERP-021 use the dev bench; its tests discover ERP-014 in apps/engine.
          # - Components are also used by discovery, studio and the engine.
          echo "brand=$(check_path '^docs/brand/(tools|tokens)/')" >> "$GITHUB_OUTPUT"
          echo "blueprint=$(check_path '^(services/(blueprint|discovery/templates)/|components/|docs/brand/(tools|tokens)/)')" >> "$GITHUB_OUTPUT"
          echo "control_plane=$(check_path '^services/control-plane/')" >> "$GITHUB_OUTPUT"
          echo "datasets=$(check_path '^services/datasets/')" >> "$GITHUB_OUTPUT"
          echo "discovery=$(check_path '^(services/(discovery|blueprint)/|components/)')" >> "$GITHUB_OUTPUT"
          echo "gateway=$(check_path '^(services/gateway/|services/blueprint/)')" >> "$GITHUB_OUTPUT"
          echo "operate=$(check_path '^(services/(operate|blueprint|control-plane|gateway)/)')" >> "$GITHUB_OUTPUT"
          echo "studio=$(check_path '^(services/studio/|services/blueprint/|services/datasets/|components/)')" >> "$GITHUB_OUTPUT"
          echo "engine=$(check_path '^(apps/engine/|services/blueprint/|components/|infra/dev/docker/)')" >> "$GITHUB_OUTPUT"
          echo "evals=$(check_path '^(evals/|services/(blueprint|discovery|operate)/)')" >> "$GITHUB_OUTPUT"
          echo "scripts=$(check_path '^scripts/')" >> "$GITHUB_OUTPUT"
          echo "infra=$(check_path '^(infra/|apps/engine/)')" >> "$GITHUB_OUTPUT"
          echo "components=$(check_path '^(components/|apps/engine/|services/blueprint/)')" >> "$GITHUB_OUTPUT"

      # --- brand tools ---
      - name: Tenant theme and contrast tests (QA-007)
        if: steps.filter.outputs.brand == 'true' && !cancelled()
        env:
          # Blueprint token tests require docs tools to remain free of bytecode.
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest docs/brand/tools -q

      # --- services/blueprint ---
      - name: Install dependencies (services/blueprint)
        if: steps.filter.outputs.blueprint == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/blueprint)
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 -m compileall services/blueprint

      - name: Blueprint validator, compiler and adapter tests
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 -m pytest services/blueprint/tests -q

      - name: Contract example validates
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: PYTHONPATH=services/blueprint python3 -m validator contracts/examples/blueprint-trading-minimal.json

      - name: Contract schemas and examples
        if: steps.filter.outputs.blueprint == 'true' && !cancelled()
        run: python3 scripts/check_contracts.py

      # --- services/control-plane ---
      - name: Lint (services/control-plane)
        if: steps.filter.outputs.control_plane == 'true' && !cancelled()
        run: python3 -m compileall services/control-plane

      - name: Control-plane identity and support tests
        if: steps.filter.outputs.control_plane == 'true' && !cancelled()
        run: python3 -m pytest services/control-plane/tests -q

      # --- services/datasets ---
      - name: Lint (services/datasets)
        if: steps.filter.outputs.datasets == 'true' && !cancelled()
        run: python3 -m compileall services/datasets

      - name: Datasets generator and loader tests (DAT-002)
        if: steps.filter.outputs.datasets == 'true' && !cancelled()
        run: python3 -m pytest services/datasets/tests -q

      # --- services/discovery ---
      - name: Install dependencies (services/discovery)
        if: steps.filter.outputs.discovery == 'true'
        run: pip install -r services/discovery/requirements.txt -r services/blueprint/requirements.txt

      - name: Lint (services/discovery)
        if: steps.filter.outputs.discovery == 'true' && !cancelled()
        run: python3 -m compileall services/discovery

      - name: Discovery and connector tests
        if: steps.filter.outputs.discovery == 'true' && !cancelled()
        run: python3 -m pytest services/discovery/tests -q

      - name: Discovery accountant view, gap analysis, quote and template flow tests
        if: steps.filter.outputs.discovery == 'true' && !cancelled()
        run: >-
          python3 -m pytest services/discovery/accountant_view/tests services/discovery/gap_analysis/tests
          services/discovery/quote/tests services/discovery/template_flow/tests -q

      # --- services/gateway ---
      - name: Install dependencies (services/gateway)
        if: steps.filter.outputs.gateway == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/gateway)
        if: steps.filter.outputs.gateway == 'true' && !cancelled()
        run: python3 -m compileall services/gateway

      - name: Gateway edge and token metering tests (PLT-024, PLT-025)
        if: steps.filter.outputs.gateway == 'true' && !cancelled()
        env:
          REQUIRE_EVSTREAM_TESTS: "1"
          PYTHONPATH: services:services/blueprint/events
        run: python3 -m unittest discover -s services/gateway/tests -v

      # --- services/operate ---
      - name: Install dependencies (services/operate)
        if: steps.filter.outputs.operate == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/operate)
        if: steps.filter.outputs.operate == 'true' && !cancelled()
        run: python3 -m compileall services/operate

      - name: Tool API and AG-UI tests (OPR-003, OPR-020)
        if: steps.filter.outputs.operate == 'true' && !cancelled()
        run: python3 -m pytest services/operate/tests -q

      - name: Operate tenant memory tests
        if: steps.filter.outputs.operate == 'true' && !cancelled()
        run: python3 -m pytest services/operate/memory/tests -q

      # --- services/studio ---
      - name: Install dependencies (services/studio)
        if: steps.filter.outputs.studio == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (services/studio)
        if: steps.filter.outputs.studio == 'true' && !cancelled()
        run: python3 -m compileall services/studio

      - name: Studio API and static tests
        if: steps.filter.outputs.studio == 'true' && !cancelled()
        run: python3 -m pytest services/studio/tests -q

      # --- apps/engine ---
      - name: Install dependencies (apps/engine)
        if: steps.filter.outputs.engine == 'true'
        run: pip install -r services/blueprint/requirements.txt "pydantic>=2"

      - name: Lint (apps/engine)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        run: python3 -m compileall apps/engine

      - name: Change engine security mock tests, fast (CE-SEC-001..004; real-bench run is real-bench.yml)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_caller_roles.py apps/engine/change_engine/change_engine/tests/test_ce_sec_003_security.py apps/engine/change_engine/change_engine/tests/test_ce_sec_003_policy_persistence.py apps/engine/change_engine/change_engine/tests/test_api_deployment.py -q

      # Live-only CE-SEC-005 suites run in real-bench.yml:
      # apps/engine/change_engine/change_engine/tests/test_ce_sec_005_real_bench.py
      # apps/engine/change_engine/change_engine/tests/test_ce_sec_005_live_http.py
      # Suite B requires a dedicated MariaDB dev stack (see apps/engine/change_engine/README.md):
      # apps/engine/change_engine/change_engine/tests/test_live_mariadb_suite_b.py
      # The standalone Phase 4 suite needs its policy-store fixture updated before CI:
      # apps/engine/change_engine/change_engine/tests/test_phase4_report.py
      - name: Tenant provisioning script tests (ERP-003)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_003_tenant_provisioning.py -v

      - name: Bilingual tax invoice print format tests (ERP-007)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine:.
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_007_bilingual_tax_invoice.py -v

      - name: Apply with preview and DDL plan gate tests (BPL-007)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_007_apply_preview_gate.py -q

      - name: DDL plan gate decimal drift and fail-closed tests (ERP-027)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_erp_027_decimal_drift.py apps/engine/change_engine/change_engine/tests/test_erp_027_review_fixes.py apps/engine/change_engine/change_engine/tests/test_ai_control_plane.py -q

      - name: Blueprint rollback tests (BPL-008)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_008_blueprint_rollback.py -q

      - name: Engine adapter unit tests (BPL-012, ERP-012)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_012_engine_adapter.py apps/engine/change_engine/change_engine/tests/test_erp_012_frappe_adapter.py -q

      - name: Durable adapter state and production guard tests (ERP-026, offline)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: >-
          python3 -m pytest -q
          apps/engine/change_engine/change_engine/tests/test_erp_026_durable_adapter_state.py
          apps/engine/change_engine/change_engine/tests/test_erp_026_review_fixes.py
          apps/engine/change_engine/change_engine/tests/test_erp_026_pr126_review_fixes.py

      - name: Trading fixture real-adapter offline tests (BPL-027; bench tests skip without a bench)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m pytest apps/engine/change_engine/change_engine/tests/test_bpl_027_fixture_real_adapter.py -q

      - name: Phase 0 engine proof unit and contract tests (ERP-021)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_021_phase0_proofs.py -v

      - name: Change engine configuration and policy unit tests
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine
        run: |
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_phase2_property_setter.py -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_phase3_workflow.py -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_policy_enforcer.py -v

      - name: Engine record events and KSA accounts tests
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          PYTHONPATH: apps/engine/change_engine:.
        run: |
          if [ -f apps/engine/change_engine/change_engine/tests/test_erp_009_record_events.py ]; then
            PYTHONPATH=apps/engine/change_engine:services/blueprint/events:. python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_009_record_events.py -v
          fi
          if [ -f apps/engine/change_engine/change_engine/tests/test_cmp_006_ksa_accounts.py ]; then
            python3 -m unittest apps/engine/change_engine/change_engine/tests/test_cmp_006_ksa_accounts.py -v
          fi

      - name: Engine adapter conformance suite (BPL-025 via change_engine.adapter)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_harness
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q

      - name: Frappe runtime engine adapter conformance suite (ERP-012 via make_frappe_harness)
        if: steps.filter.outputs.engine == 'true' && !cancelled()
        env:
          ADAPTER_HARNESS: change_engine.adapter.harness:make_frappe_harness
          CHANGE_ENGINE_ENV: test
          PYTHONPATH: services/blueprint:apps/engine/change_engine
        run: python3 -m pytest services/blueprint/tests/adapter -q

      # --- evals ---
      - name: Install dependencies (evals)
        if: steps.filter.outputs.evals == 'true'
        run: pip install -r services/blueprint/requirements.txt -r evals/requirements.txt -r services/discovery/requirements.txt

      - name: Eval harness tests and sets
        if: steps.filter.outputs.evals == 'true' && !cancelled()
        run: |
          python3 -m pytest evals/tests -q
          python3 -m evals.harness check

      # --- scripts ---
      - name: Script tests (phase exit check)
        if: steps.filter.outputs.scripts == 'true' && !cancelled()
        run: python3 -m pytest scripts/tests -q

      # --- infra ---
      # Dev bench discovery loads apps/engine/change_engine/change_engine/tests/test_erp_014_accounting_properties.py.
      - name: Dev bench contract, pin and entrypoint tests (live tests skip without a bench)
        if: steps.filter.outputs.infra == 'true' && !cancelled()
        working-directory: infra/dev/docker
        run: python3 -m unittest discover -s tests -v

      - name: Engine invisibility crawler tests (QA-016)
        if: steps.filter.outputs.infra == 'true' && !cancelled()
        run: |
          if [ -d infra/invisibility/tests ]; then
            python3 -m unittest discover -s infra/invisibility/tests -v
          fi

      # --- components ---
      - name: Install dependencies (components)
        if: steps.filter.outputs.components == 'true'
        run: pip install -r services/blueprint/requirements.txt

      - name: Trading Arabic pack and engine audit tests
        if: steps.filter.outputs.components == 'true' && !cancelled()
        run: |
          python3 -m unittest discover -s components/core/trading_ar/tests -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_erp_006_arabic_translations.py -v

      - name: ZATCA Phase 1 component and engine wrapper tests (CMP-003)
        if: steps.filter.outputs.components == 'true' && !cancelled()
        run: |
          python3 -m unittest discover -s components/compliance/zatca_sa/tests -t . -v
          python3 -m unittest apps/engine/change_engine/change_engine/tests/test_zatca_phase1_engine.py -v

      - name: Country pack framework tests (CMP-021)
        if: steps.filter.outputs.components == 'true' && !cancelled()
        run: python3 -m unittest discover -s components/compliance/country_pack/tests -t . -v

  # ERP-026 (ADR-0041): the durable adapter store guards double-apply, so its MariaDB tests must run on every change and
  # may never skip silently. REQUIRE_ERP026_MARIADB=1 turns a missing server, driver or container into a failure.
  erp-026-mariadb:
    name: ERP-026 adapter state on MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4@sha256:f6eca93803e34766e787a96bad9e2ac5abbcdcb8e7f390a6f34e9bf3eee525e6
        env:
          MARIADB_ROOT_PASSWORD: ci_throwaway_not_a_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install "pydantic>=2" "pymysql>=1.1"
      - name: Find the MariaDB service container (the restore test runs mariadb-dump inside it)
        run: echo "ERP026_MARIADB_CONTAINER=$(docker ps --filter publish=3306 --format '{{.ID}}' | head -n 1)" >> "$GITHUB_ENV"
      - name: Adapter store, multi-worker, race and tenant binding tests on MariaDB (none may skip)
        env:
          REQUIRE_ERP026_MARIADB: "1"
          ERP026_MARIADB: "127.0.0.1:3306:root:ci_throwaway_not_a_secret"
          PYTHONPATH: apps/engine/change_engine
        run: >-
          python3 -m unittest -v
          change_engine.tests.test_erp_026_durable_adapter_state
          change_engine.tests.test_erp_026_review_fixes
          change_engine.tests.test_erp_026_pr126_review_fixes

  deploy-staging:
    name: Deploy to staging (disabled)
    needs: [python-tests]
    runs-on: ubuntu-latest
    # Disabled until INF-001 (hosting choice) and INF-004 (staging setup).
    # When enabled, gate on: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Deploy placeholder
        run: |
          echo "Staging deployment is disabled: INF-001 hosting decision and staging environment not yet provisioned."
          echo "See infra/staging.md for founder setup requirements."
