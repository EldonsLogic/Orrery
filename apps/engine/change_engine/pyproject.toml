[project]
name = "change_engine"
description = "Guarded configuration apply layer for the Seshna engine"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe and erpnext come from the pinned bench, not from here
    "pydantic>=2",
    "hijridate==2.6.0",
]

[project.optional-dependencies]
# MariaDB adapter state store (ERP-026); the bench already ships pymysql
mariadb = ["pymysql>=1.1"]

[build-system]
requires = ["flit_core >=3.4,<5"]
build-backend = "flit_core.buildapi"
